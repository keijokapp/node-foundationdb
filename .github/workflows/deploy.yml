  deploy-npm:
    needs: [prebuild-macos, prebuild-linux]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'

    - uses: actions/download-artifact@v4
      with:
        name: darwin
        path: prebuilds

    - uses: actions/download-artifact@v4
      with:
        name: linux-x64
        path: prebuilds

    - run: ls -R prebuilds

    - run: wget -nv "https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-clients_7.3.63-1_amd64.deb"
    - run: sudo dpkg -i foundationdb-clients_7.3.63-1_amd64.deb

    - run: npm ci
    - run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
