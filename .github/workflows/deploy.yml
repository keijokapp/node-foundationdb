name: deploy

on:
  release:
    types: [created]
  workflow_dispatch: {}

jobs:
  prebuild-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - run: wget -nv "https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-clients_7.3.63-1_amd64.deb"
    - run: sudo dpkg -i foundationdb-clients_7.3.63-1_amd64.deb
    - run: sudo mkdir -p /var/lib/foundationdb/data
    - run: wget -nv "https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-server_7.3.63-1_amd64.deb"
    - run: sudo dpkg -i foundationdb-server_7.3.63-1_amd64.deb

    - run: npm ci
    - run: npm run prebuild
    - run: npm test

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-x64
        path: prebuilds/linux-*
        retention-days: 5
        if-no-files-found: error

  prebuild-macos:
    runs-on: macos-latest

    env:
      DYLD_LIBRARY_PATH: /usr/local/lib

    steps:
    - uses: actions/checkout@v4
    - name: Setup nodejs
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - run: wget -nv "https://github.com/apple/foundationdb/releases/download/7.3.63/FoundationDB-7.3.63_arm64.pkg"
    - run: sudo installer -pkg FoundationDB-7.3.63_arm64.pkg -target /

    - run: npm ci
    - run: npm test

    - run: npm run prebuild -- --arch=arm64

    - run: wget -nv "https://github.com/apple/foundationdb/releases/download/7.3.63/FoundationDB-7.3.63_x86_64.pkg"
    - run: sudo installer -pkg FoundationDB-7.3.63_x86_64.pkg -target /

    - run: npm run prebuild -- --arch=x64

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: darwin
        path: prebuilds/darwin-*
        retention-days: 5
        if-no-files-found: error

